name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview release recovery without publishing
        type: boolean
        default: false
permissions: {}
jobs:
  release:
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@1a0eb6f18b88a7816b91cbf692b8ad8ea9a08123 # v20.1.17
    with:
      dry-run: ${{ inputs.dry-run || false }}
      disable-issue-side-effects: true
      warn-missing-breaking-bang: true
      protected-release: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
