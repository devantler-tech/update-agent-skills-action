        run: |
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::Expected the action to fail on a missing directory, got: $OUTCOME"
            exit 1
          fi
  test-update-agent-skills-mark-internal:
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
