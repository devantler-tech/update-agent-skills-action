          if ! cmp .github/tests/agent-skills-fixtures/pinned-self-improvement/SKILL.md \
            .agents/skills/self-improvement/SKILL.md; then
            /usr/bin/diff .github/tests/agent-skills-fixtures/pinned-self-improvement/SKILL.md \
              .agents/skills/self-improvement/SKILL.md || true
            exit 1
          fi
          if [[ -e .agents/skills/self-improvement/stale.md ]]; then
            echo "::error::The pinned skill kept a file its commit does not have"
            exit 1
          fi
          if [[ "$UPDATED" != *"self-improvement is pinned to $expected_ref (skipped)"* ]]; then
            echo "::error::Expected gh skill update to skip the newly pinned skill"
            echo "updated-skills output: $UPDATED"
            exit 1
          fi
      - name: "\U0001F4CC Run update-agent-skills with the same pin again"
        id: pin-again
        uses: $/
        with:
          dir: .agents/skills
          pins: .agents/skills/self-improvement 7b9904e7a2739f2ecdea621c5bc548804bddb9c2
      - name: ✅ Verify the repeated pin is a no-op
        shell: bash
        env:
          CHANGED: ${{ steps.pin-again.outputs.changed }}
        run: |
          if [[ "$CHANGED" != "false" ]]; then
            echo "::error::Expected changed=false for an unchanged pin, got: $CHANGED"
            exit 1
          fi
  test-update-agent-skills:
    name: "[Test] Update Agent Skills - Dry Run"
    uses: $/.github/workflows/update-agent-skills.yaml
    permissions:
      contents: write
      pull-requests: write
    with:
      dry-run: true
  # Flag-on state of the opt-in per-skill PRs (#1309), so the input stays part of the interface;
  # test-update-agent-skills-per-skill.sh pins both states and the per-skill job's apply step.
  test-update-agent-skills-per-skill:
    name: "[Test] Update Agent Skills - Per-Skill PRs Dry Run"
    uses: $/.github/workflows/update-agent-skills.yaml
    permissions:
      contents: write
      pull-requests: write
    with:
      dry-run: true
      pr-per-skill: true
  ci-required-checks:
    name: CI - Required Checks
    if: ${{ always() }}
    needs:
      # ── .scripts/retry.sh (shared reliability helper) ──────────
      - test-retry-script
      # ── .scripts/ensure-gh-skill.sh (shared gh-skill bootstrap) ─
      - test-ensure-gh-skill-script
      # ── update-agent-skills ───────────────────────────────────
      - test-update-agent-skills-noop
      - test-update-agent-skills-dry-run
      - test-update-agent-skills-missing-dir
      - test-update-agent-skills-mark-internal
      - test-update-agent-skills
      # Flag-on state of the opt-in per-skill PRs (#1309), so the input stays part of the interface;
      # test-update-agent-skills-per-skill.sh pins both states and the per-skill job's apply step.
      - test-update-agent-skills-per-skill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every behavior check
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        # These two reusable calls validate the dry-run interface; the callee
        # deliberately skips its credential-bearing jobs in that mode.
        run: |
          jq -e 'to_entries | all(
            if .key == "test-update-agent-skills" or .key == "test-update-agent-skills-per-skill"
            then (.value.result == "success" or .value.result == "skipped")
            else .value.result == "success" end
          )' <<< "$JOB_RESULTS"
