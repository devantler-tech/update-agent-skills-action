      - name: "\U0001F9EA Test change detection covers each skill's whole directory"
        shell: bash
        run: bash .github/tests/test-update-agent-skills-change-detection.sh
      # Opt-in per-skill PRs (#1309): the splitter isolates each skill's update and fails closed on
      # a change outside every skill; the workflow keeps its single PR with the flag off.
      - name: "\U0001F9E9 Test the per-skill update splitter"
        shell: bash
        run: bash .github/tests/test-split-skill-updates.sh
      - name: "\U0001F9E9 Test the per-skill PR mode in both flag states"
        shell: bash
        run: bash .github/tests/test-update-agent-skills-per-skill.sh
      - name: "\U0001F4E6 Seed pinned agent-skill fixture"
        shell: bash
        run: |
          mkdir -p .agents/skills/self-improvement
          cp -R .github/tests/agent-skills-fixtures/pinned-self-improvement/. \
            .agents/skills/self-improvement/
      - name: "\U0001F504 Run update-agent-skills with mark-internal"
        id: update
        uses: $/
        with:
          dir: .agents/skills
          mark-internal: "true"
      - name: ✅ Verify the skill was marked internal
        shell: bash
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
          UPDATED: ${{ steps.update.outputs.updated-skills }}
        run: |
          set -euo pipefail
          skill=.agents/skills/self-improvement/SKILL.md
          fixture=.github/tests/agent-skills-fixtures/pinned-self-improvement/SKILL.md
          if [[ "$CHANGED" != "true" ]]; then
            echo "::error::Expected changed=true when mark-internal tagged a skill, got: $CHANGED"
            exit 1
          fi
          if [[ "$(yq --front-matter=extract '.metadata.internal' "$skill")" != "true" ]]; then
            echo "::error::Expected metadata.internal=true after mark-internal"
            cat "$skill"
            exit 1
          fi
          if [[ "$UPDATED" != *"Marked internal: .agents/skills/self-improvement/SKILL.md"* ]]; then
            echo "::error::Expected the tagged skill to be reported in updated-skills"
            echo "updated-skills output: $UPDATED"
            exit 1
          fi
          expected=$(grep -v '^    internal: true$' "$skill")
          if [[ "$expected" != "$(cat "$fixture")" ]]; then
            echo "::error::mark-internal changed more than the added metadata.internal line"
            /usr/bin/diff "$fixture" "$skill" || true
            exit 1
          fi
      - name: "\U0001F504 Run update-agent-skills with mark-internal again"
        id: again
        uses: $/
        with:
          dir: .agents/skills
          mark-internal: "true"
      - name: ✅ Verify the second run is a no-op
        shell: bash
        env:
          CHANGED: ${{ steps.again.outputs.changed }}
        run: |
          if [[ "$CHANGED" != "false" ]]; then
            echo "::error::Expected changed=false once every skill is already internal, got: $CHANGED"
            exit 1
          fi
      # Opt-in pins (#715): both flag states and every refusal against a stub CLI, then the real CLI.
      - name: "\U0001F4CC Test the pins contract"
        shell: bash
        run: bash .github/tests/test-update-agent-skills-pins.sh
      - name: "\U0001F4E6 Seed an unpinned agent-skill fixture with a file its commit does not have"
