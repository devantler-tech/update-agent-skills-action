          UPDATED: ${{ steps.pin.outputs.updated-skills }}
        run: |
          set -euo pipefail
          expected_ref="7b9904e7a2739f2ecdea621c5bc548804bddb9c2"
          if [[ "$CHANGED" != "true" ]]; then
            echo "::error::Expected changed=true when a pin replaced the skill, got: $CHANGED"
            exit 1
          fi
