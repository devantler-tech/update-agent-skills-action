      - name: "\U0001F4CC Run update-agent-skills with a pin"
        id: pin
        uses: $/
        with:
          dir: .agents/skills
          pins: |
            # The reviewed commit the fixture records.
            .agents/skills/self-improvement 7b9904e7a2739f2ecdea621c5bc548804bddb9c2
      - name: ✅ Verify the skill is held at the pinned commit
        shell: bash
        env:
