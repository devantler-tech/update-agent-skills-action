name: 🔄 Update Agent Skills

on:
  workflow_call:
    inputs:
      dir:
        description: Directory to scan for installed skills (passed to `gh skill update --dir`)
        required: false
        type: string
        default: "."
      unpin:
        description: When `true`, pass `--unpin` to `gh skill update` (clear pins and include pinned skills)
        required: false
        type: boolean
        default: false
      mark-internal:
        description: >-
          When `true`, set `metadata.internal: true` on every SKILL.md under `dir` after updating, so
          discovery tools such as `npx skills` do not offer vendored skills as the repository's own.
        required: false
        type: boolean
        default: false
      pins:
        description: >-
          Skills to hold at a reviewed upstream commit, one per line as `<skill-dir> <40-character
          commit>`, so the update pull request carries the pin and every other skill keeps updating.
          Blank lines and `#` comments are ignored. Cannot be combined with `unpin`. Empty (the default)
          pins nothing.
        required: false
        type: string
        default: ""
      gh-version:
        description: Minimum required `gh` version (must support `gh skill`)
        required: false
        type: string
        default: 2.90.0
      pr-per-skill:
        description: >-
          When `true`, open one PR per changed skill instead of one PR for every skill, so a skill
          whose update is blocked holds back only itself. Each PR comes from `<pr-branch>-<skill>`
          (the skill's path under `dir`, with `/` replaced by `-`), is titled `<pr-title> (<skill>)`
          and contains only that skill's files. A change that belongs to no skill fails the run.
          Defaults to `false` (one PR from `pr-branch`, as before); opt in only after any follow-up
          job, auto-merge rule or review exemption that matches the exact `pr-branch` also accepts
          the per-skill branches.
        required: false
        default: false
        type: boolean
      pr-branch:
        description: Branch the update PR is opened from
        required: false
        type: string
        default: deps/agent-skills-update
      pr-title:
        description: Title of the update PR
        required: false
        type: string
        default: "chore(deps): update agent skills"
      pr-labels:
        description: Comma-separated labels applied to the update PR
        required: false
        type: string
        default: dependencies,automation
      commit-message:
        description: Commit message for the update PR
        required: false
        type: string
        default: "chore(deps): update agent skills"
      dry-run:
        description: "Skip update and PR creation (validate workflow interface only)"
        required: false
        default: false
        type: boolean
      use-app-token:
        description: >-
          When `true`, create the update PR with a GitHub App token from the GitHub token broker
          instead of the default `GITHUB_TOKEN`. The broker serves devantler-tech repositories only,
          on `main`, and every caller job grants `id-token: write`. A PR
          opened with `GITHUB_TOKEN` does NOT trigger the caller's `on: pull_request`/`push` CI runs,
          so its required checks never report and it stays blocked; an App token avoids this.
          Defaults to `false` (previous behaviour using `GITHUB_TOKEN`).
        required: false
        default: false
        type: boolean
    secrets:
      APP_PRIVATE_KEY:
        description: >-
          Retired and unused: the App token comes from the GitHub token broker. Still declared so
          callers that pass it keep working.
        required: false
    outputs:
      skills:
        description: >-
          With `pr-per-skill`, a JSON array of `{"slug", "path"}` for every skill that got its own
          PR (its branch is `<pr-branch>-<slug>`), so a follow-up job can act on each branch. Empty
          otherwise.
        value: ${{ jobs.update-agent-skills.outputs.skills }}

permissions: {}

jobs:
  update-agent-skills:
    name: Update agent skills
    if: ${{ !inputs.dry-run }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # proves this job to the GitHub token broker (devantler-tech/monorepo ADR 0020)
    outputs:
      skills: ${{ steps.split.outputs.skills }}
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: ${{ inputs.use-app-token }}
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech
          identity: update-agent-skills

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || github.token }}

      # The optional splitter comes from this workflow's exact source commit. Copy it out
      # and remove the checkout before the action scans the caller's installed skills.
      - name: 📥 Checkout update-agent-skills-action (this workflow's commit)
        if: ${{ inputs.pr-per-skill }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false

      - name: 📋 Keep the per-skill splitter
        if: ${{ inputs.pr-per-skill }}
        run: |
          cp .devantler-tech-actions/.github/scripts/split-skill-updates.sh "$RUNNER_TEMP/split-skill-updates.sh"
          cp .devantler-tech-actions/.github/scripts/describe-skill-update.sh "$RUNNER_TEMP/describe-skill-update.sh"
          cp .devantler-tech-actions/.github/scripts/describe-skill-updates.sh "$RUNNER_TEMP/describe-skill-updates.sh"

      # Root scans must not discover the checkout's fixture skills, and the PR must not
      # carry the checkout as a stray gitlink. The action itself resolves through $/.
      - name: 🧹 Remove self-checkout
        if: ${{ inputs.pr-per-skill }}
        run: rm -rf .devantler-tech-actions

      - name: 🔄 Update installed skills
        id: update
        uses: $/
        with:
          dir: ${{ inputs.dir }}
          unpin: ${{ inputs.unpin }}
          mark-internal: ${{ inputs.mark-internal }}
          pins: ${{ inputs.pins }}
          gh-version: ${{ inputs.gh-version }}

      # Per-skill mode (#1309): one patch per changed skill, opened as its own PR by the job below,
      # so a skill whose update is blocked holds back only itself (agent-plugins#175).
      - name: 🧩 Split the update per skill
        id: split
        if: ${{ inputs.pr-per-skill && steps.update.outputs.changed == 'true' }}
        env:
          SKILLS_DIR: ${{ inputs.dir }}
        run: |
          set -euo pipefail
          manifest="$(bash "$RUNNER_TEMP/split-skill-updates.sh" "$SKILLS_DIR" "$RUNNER_TEMP/skill-updates")"
          echo "Per-skill updates: $manifest"
          echo "skills=$manifest" >> "$GITHUB_OUTPUT"

      # Each per-skill PR states its skill's upstream range, licence and repository state
      # (devantler-tech/.github#745). HEAD still holds every old copy and the working tree every new
      # one. Upstream text is hostile and the describer renders it inert; a describer failure leaves
      # a visible warning in that PR instead of stopping every other skill's update.
      - name: 📝 Describe each skill's update
        if: ${{ steps.split.outputs.skills != '' && steps.split.outputs.skills != '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLS: ${{ steps.split.outputs.skills }}
        run: |
          set -euo pipefail
          jq -r '.[] | [.slug, .path] | @tsv' <<<"$SKILLS" > "$RUNNER_TEMP/skills.tsv"
          # One total time budget for every description (#15): once it is spent, the remaining
          # skills get the warning body, so the pull requests still open.
          bash "$RUNNER_TEMP/describe-skill-updates.sh" "$RUNNER_TEMP/describe-skill-update.sh" \
            "$RUNNER_TEMP/skill-updates" < "$RUNNER_TEMP/skills.tsv"

      - name: 📤 Upload the per-skill patches
        if: ${{ steps.split.outputs.skills != '' && steps.split.outputs.skills != '[]' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skill-updates
          path: ${{ runner.temp }}/skill-updates
          if-no-files-found: error
          retention-days: 1

      - name: 📦 Create pull request
        if: ${{ !inputs.pr-per-skill && steps.update.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.pr-title }}
          body: |
            Automated update of agent skills to their latest versions.

            Updated files under `${{ inputs.dir }}`:

            ```
            ${{ steps.update.outputs.updated-skills }}
            ```
          branch: ${{ inputs.pr-branch }}
          labels: ${{ inputs.pr-labels }}
          delete-branch: true
          # Commit through the GitHub API rather than locally, so GitHub signs the commit.
          # Without this the updater's commit is `verified: false, reason: unsigned`, which
          # holds the branch-scoped signature rule open for the whole org
          # (devantler-tech/.github#142). The fixer lanes were migrated in #1005/#1011/#1036
          # Other reviewed App workflows already set this; this workflow was missed.
          sign-commits: true
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch-token: ${{ steps.app-token.outputs.token || github.token }}

  # One PR per changed skill (opt-in, #1309). Each leg starts from the same commit the update ran
  # on, applies only its own skill's patch, and refuses to open a PR carrying anything else.
  open-skill-pull-requests:
    name: Open PR for ${{ matrix.skill.path }}
    needs: update-agent-skills
    if: ${{ inputs.pr-per-skill && needs.update-agent-skills.outputs.skills != '' && needs.update-agent-skills.outputs.skills != '[]' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # proves this job to the GitHub token broker (devantler-tech/monorepo ADR 0020)
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.update-agent-skills.outputs.skills) }}
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: ${{ inputs.use-app-token }}
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech
          identity: update-agent-skills

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: 📥 Download the per-skill patches
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-skill-updates
          path: ${{ runner.temp }}/skill-updates

      - name: 🩹 Apply only this skill's update
        env:
          SKILL_SLUG: ${{ matrix.skill.slug }}
          SKILL_PATH: ${{ matrix.skill.path }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/skill-updates/${SKILL_SLUG}.patch"
          [[ -s "$patch" ]] || { echo "::error::No patch for ${SKILL_PATH}"; exit 1; }
          git apply --binary "$patch"
          status_file="$(mktemp)"
          trap 'rm -f -- "$status_file"' EXIT
          git status --porcelain=v1 --untracked-files=all -z > "$status_file"
          [[ -s "$status_file" ]] || { echo "::error::The ${SKILL_PATH} patch changed nothing"; exit 1; }
          check_skill_path() {
            if [[ "$1" != "${SKILL_PATH}/"* ]]; then
              echo "::error::The ${SKILL_PATH} patch changed $1, outside that skill"
              exit 1
            fi
          }
          while IFS= read -r -d '' record; do
            check_skill_path "${record:3}"
            # Porcelain -z emits a second raw path for a rename or copy. Check both.
            case "${record:0:2}" in
              *R*|*C*) IFS= read -r -d '' source; check_skill_path "$source" ;;
            esac
          done < "$status_file"

      - name: 📦 Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: ${{ inputs.commit-message }} (${{ matrix.skill.path }})
          title: ${{ inputs.pr-title }} (${{ matrix.skill.path }})
          # Written by the update job's describe step, which always leaves one per skill.
          body-path: ${{ runner.temp }}/skill-updates/${{ matrix.skill.slug }}.md
          branch: ${{ inputs.pr-branch }}-${{ matrix.skill.slug }}
          labels: ${{ inputs.pr-labels }}
          delete-branch: true
          # Commit through the GitHub API so GitHub signs it (devantler-tech/.github#142).
          sign-commits: true
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch-token: ${{ steps.app-token.outputs.token || github.token }}
